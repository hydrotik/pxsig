[package]
name = "pxsig-cli"
description = "pxsig command-line tool: capture, compare and batch-check rendered PNGs against .psig baselines (spec v1)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "pxsig"
path = "src/main.rs"

[dependencies]
pxsig-core = { path = "../pxsig-core" }
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
png.workspace = true
rayon.workspace = true
clap.workspace = true
anyhow.workspace = true
sha2.workspace = true
pxsig-react = { path = "../pxsig-react", optional = true }

[features]
# The built-in React Compiler (oxc_react_compiler, about 3 MB): `pxsig react-compile`. Off by
# default; the release build and CI turn it on (`-p pxsig-cli --features react-oxc`).
react-oxc = ["dep:pxsig-react"]

[lints]
workspace = true
