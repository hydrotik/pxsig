        - text: Mode
        - combobox "Mode":
            - option "All modes" [selected]
            - option "dark"
            - option "light"
        - text: Sort
        - combobox "Sort":
            - option "Largest change first" [selected]
            - option "Story ID"
            - option "Slowest render"
        - text: Group
        - combobox "Group":
            - option "By component" [selected]
            - option "None"
        - text: 3 of 3
