- main:
  - status
- dialog "components-badge--success@dark": 879%
- dialog "Report to pxsig":
  - heading "Report to pxsig" [level=2]
  - paragraph: "A gate report for an issue on hydrotik/pxsig: the text in the shape of the issue form, and one image. The story ID is replaced with entry-1; no paths or user names."
  - status: "Re-rendered on this machine: still fails the gate."
  - alert "Public": Public This goes in a public GitHub issue on hydrotik/pxsig. Anyone can see it, and it can't be fully removed. Copy it only if the images show nothing confidential.
  - switch "Full capture instead of the changed regions"
  - text: Full capture
  - switch "Keep the story ID instead of entry-1"
  - text: Keep story ID
  - 'switch "No image: the changed regions and their average colors only"'
  - text: Image-free
  - heading "Image" [level=3]
  - img "Baseline, render and diff side by side"
  - heading "Text" [level=3]
