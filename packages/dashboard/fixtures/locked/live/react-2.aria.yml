- navigation "Report sections":
  - heading "pxsig • example-single" [level=1]
  - list:
    - listitem:
      - link "Overview":
        - /url: "#overview"
    - listitem:
      - link "Review Stories":
        - /url: "#stories"
    - listitem:
      - link "Coverage":
        - /url: "#integrity"
    - listitem:
      - link "Accessibility":
        - /url: "#a11y"
