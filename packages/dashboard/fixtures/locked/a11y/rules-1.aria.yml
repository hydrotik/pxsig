  - button "Review 2 accessibility entries"
  - text: dark · light Live Can approve
  - button "Light theme"
  - text: Approved
- main:
  - heading "Accessibility" [level=2]
  - text: Entries scanned 2 Violations 2 New, not accepted 2 Rules 1 New violations are not on their entry's accepted list. Accept or reject them in an accessibility review, or from the Accessibility panel of an entry in the inspector.
  - button "Review 2 accessibility entries"
  - heading "Rules" [level=3]
  - paragraph:
    - text: axe-core results per rule. New counts entries where the rule is not on the entry's accepted list (
    - code: a11y.json
    - text: ); Accepted counts those where it is. Open a rule to see its entries and unaccept one in the inspector.
  - grid "Data grid":
    - rowgroup:
      - row "Status Rule Impact Description Entries Nodes Accepted New":
        - columnheader "Status":
          - text: Status
          - separator "Resize Status column"
        - columnheader "Rule":
          - button "Rule"
          - separator "Resize Rule column"
        - columnheader "Impact":
          - button "Impact"
          - separator "Resize Impact column"
        - columnheader "Description":
          - button "Description"
          - separator "Resize Description column"
        - columnheader "Entries":
          - button "Entries"
          - separator "Resize Entries column"
        - columnheader "Nodes":
          - button "Nodes"
          - separator "Resize Nodes column"
        - columnheader "Accepted":
          - text: Accepted
          - separator "Resize Accepted column"
        - columnheader "New":
          - button "New"
          - separator "Resize New column"
    - rowgroup:
      - row "2 new color-contrast serious Elements must meet minimum color contrast ratio thresholds 2 4 0 2":
        - gridcell "2 new"
        - gridcell "color-contrast"
        - gridcell "serious"
        - gridcell "Elements must meet minimum color contrast ratio thresholds"
        - gridcell "2"
        - gridcell "4"
        - gridcell "0"
        - gridcell "2"
  - status
  - text: "1 row(s) Rows per page:"
  - combobox "Rows per page": "10"
  - text: Page 1 of 1
  - button "First page" [disabled]: ⟨⟨
  - button "Previous page" [disabled]: ⟨
