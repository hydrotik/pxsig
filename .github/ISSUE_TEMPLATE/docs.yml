name: Documentation
description: Something in the docs is wrong, missing or unclear.
title: '[docs] '
labels: [documentation]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The file or section.
      placeholder: docs/cli.md#pxsig-check
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested wording
