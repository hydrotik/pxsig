name: bench

# The scale benchmark (scripts/bench/run.mjs): pxsig's read paths on a synthetic store of
# hydrotik's size, against the budgets of decision 100 and the last release's times. Nightly and
# by hand; never on pull requests, so it adds nothing to a PR's wait.
on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    name: Scale benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-26
        with:
          toolchain: 1.99.0 # rust-toolchain.toml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --release
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The table goes to this run's summary page; a step over budget fails the job.
      - run: node scripts/bench/run.mjs --runs 5 --out bench-results.json
      # In baseline.json's shape: a release commits it as scripts/bench/baseline.json (docs/releasing.md).
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-results
          path: bench-results.json
          if-no-files-found: ignore
          retention-days: 30
