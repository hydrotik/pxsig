# Release: build the pxsig binary for every platform, collect the dashboard, pack every package,
# attest and checksum what was packed, attach it to the GitHub release, publish to npm.
#
# Trigger: push a tag vX.Y.Z (or vX.Y.Z-pre.N, published under the `next` dist-tag), or run it by
# hand on a tag ref (workflow_dispatch). A dry run (dry_run: true) may also run on a branch. See
# docs/releasing.md.
#
# Published here: `pxsig`, the per-platform binary packages `@pxsig/cli-<platform>-<arch>` and
# `@pxsig/storybook-addon`.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run npm publish with --dry-run (build and pack everything, publish nothing).
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify versions
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read # the tagged commit's check runs
    outputs:
      version: ${{ steps.v.outputs.version }}
      dist_tag: ${{ steps.v.outputs.dist_tag }}
      dry_run: ${{ steps.v.outputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tagged commit must be on origin/main
      - id: v
        name: Tag, Cargo workspace and every package.json must agree
        shell: bash
        env:
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          dry_run=false
          if [ "${DRY_RUN_INPUT}" = "true" ]; then dry_run=true; fi
          echo "dry_run=${dry_run}" >> "$GITHUB_OUTPUT"
          npm=$(node -p "require('./packages/pxsig/package.json').version")
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [[ "${GITHUB_REF_NAME}" == v* ]]; then
            tag="${GITHUB_REF_NAME#v}"
          elif [ "$dry_run" = true ]; then
            # A dry run on a branch has no tag to check: the version files must still agree.
            echo "::notice::dry run on ${GITHUB_REF_TYPE} ${GITHUB_REF_NAME}: checking the version files against each other only"
            tag="$npm"
          else
            echo "::error::run this workflow on a tag ref vX.Y.Z, or pass dry_run (got ${GITHUB_REF_TYPE} ${GITHUB_REF_NAME})"
            exit 1
          fi
          # Cargo.toml, Cargo.lock, packages/pxsig, packages/storybook-addon, packages/dashboard.
          node scripts/check-versions.mjs --tag "v${tag}"
          if [[ "$tag" == *-* ]]; then dist_tag=next; else dist_tag=latest; fi
          echo "version=${tag}" >> "$GITHUB_OUTPUT"
          echo "dist_tag=${dist_tag}" >> "$GITHUB_OUTPUT"
      # A tag publishes only a commit that main has and that passed every required check
      # (scripts/required-checks.mjs, the one list of them). A dry run publishes nothing: skipped.
      - name: The tagged commit is on main and passed the required checks
        if: github.ref_type == 'tag' && steps.v.outputs.dry_run != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on origin/main: tag a commit that main has"
            exit 1
          fi
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" > "${RUNNER_TEMP}/check-runs.json"
          node scripts/required-checks.mjs "${RUNNER_TEMP}/check-runs.json"

  test:
    name: Rust tests (linux-x64)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-26
        with:
          toolchain: 1.99.0 # rust-toolchain.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace --locked

  build:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    timeout-minutes: 30
    needs: test
    strategy:
      fail-fast: true
      matrix:
        include:
          - {
              platform: darwin,
              arch: arm64,
              os: macos-latest,
              target: aarch64-apple-darwin,
              exe: pxsig,
            }
          # Cross-compiled on Apple silicon: the Intel macOS runners are being retired.
          - {
              platform: darwin,
              arch: x64,
              os: macos-latest,
              target: x86_64-apple-darwin,
              exe: pxsig,
            }
          - {
              platform: linux,
              arch: x64,
              os: ubuntu-latest,
              target: x86_64-unknown-linux-gnu,
              exe: pxsig,
            }
          - {
              platform: linux,
              arch: arm64,
              os: ubuntu-24.04-arm,
              target: aarch64-unknown-linux-gnu,
              exe: pxsig,
            }
          - {
              platform: win32,
              arch: x64,
              os: windows-latest,
              target: x86_64-pc-windows-msvc,
              exe: pxsig.exe,
            }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-26
        with:
          toolchain: 1.99.0 # rust-toolchain.toml
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }} -p pxsig-cli
      # crt-static (.cargo/config.toml): the published engine needs no Visual C++ Redistributable.
      - if: matrix.platform == 'win32'
        run: node scripts/check-win-runtime.mjs target/${{ matrix.target }}/release/pxsig.exe
      # Smoke: the binary starts on the runner that built it (darwin-x64 is cross-compiled and
      # runs under Rosetta when the runner has it; the step says so when it does not).
      - name: Smoke
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/${{ matrix.exe }}"
          if "$bin" --version; then exit 0; fi
          if [ "${{ matrix.arch }}" = x64 ] && [ "${{ matrix.platform }}" = darwin ]; then echo "::notice::darwin-x64 not runnable here (no Rosetta)"; exit 0; fi
          exit 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pxsig-${{ matrix.platform }}-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/${{ matrix.exe }}
          if-no-files-found: error
          retention-days: 7

  dashboard:
    name: Dashboard
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: verify
    env:
      # A git URL (credentials included) of the design-system monorepo the dashboard compiles
      # from. Empty when the secret is not set: then the dashboard comes from the release asset.
      DS_SOURCE: ${{ secrets.PXSIG_DS_SOURCE }}
      DS_REF: ${{ vars.PXSIG_DS_REF }}
      DRY_RUN: ${{ needs.verify.outputs.dry_run }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: how
        name: Choose the dashboard source
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${DS_SOURCE}" ]; then
            echo "mode=build" >> "$GITHUB_OUTPUT"
          elif gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx 'pxsig-dashboard.tar.gz'; then
            echo "mode=release" >> "$GITHUB_OUTPUT"
          elif [ "${DRY_RUN}" = true ]; then
            # Nothing is published in a dry run, so a placeholder lets every other job be checked.
            echo "::warning::dry run without a dashboard source: packing a placeholder dashboard/index.html"
            echo "mode=placeholder" >> "$GITHUB_OUTPUT"
          else
            echo "::error::no dashboard: set the PXSIG_DS_SOURCE secret, or attach pxsig-dashboard.tar.gz to the GitHub release ${GITHUB_REF_NAME} (see docs/releasing.md)"
            exit 1
          fi
          echo "dashboard source: $(grep '^mode=' "$GITHUB_OUTPUT" | tail -1)" >> "$GITHUB_STEP_SUMMARY"

      # Mode build: compile the dashboard against a checkout of the design system.
      - if: steps.how.outputs.mode == 'build'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # Node for the build, and for the BUILD.json check in both modes that ship a real dashboard.
      - if: steps.how.outputs.mode != 'placeholder'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - if: steps.how.outputs.mode == 'build'
        name: Build the dashboard
        shell: bash
        run: |
          set -euo pipefail
          # The design system is pinned by commit, so BUILD.json (written by the build) names
          # exactly what the bundle was compiled from.
          if ! [[ "${DS_REF}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::the PXSIG_DS_REF variable must be the design system's full 40-character commit SHA (lower-case hex); got '${DS_REF}'"
            exit 1
          fi
          ds="${RUNNER_TEMP}/design-system"
          git init -q "$ds"
          git -C "$ds" fetch -q --depth 1 "${DS_SOURCE}" "${DS_REF}"
          git -C "$ds" checkout -q --detach FETCH_HEAD
          (cd "$ds" && pnpm install --frozen-lockfile)
          pnpm install --frozen-lockfile
          # The adapter is named, not left to the default: the release ships the reference look.
          PXSIG_UI_ADAPTER=hydrotik PXSIG_DS_SOURCE="$ds" pnpm --filter @pxsig/dashboard build
          node scripts/check-dashboard-build.mjs packages/pxsig/dist/dashboard --adapter hydrotik --commit "${DS_REF}"

      # Mode placeholder (dry run only): an index.html that says so.
      - if: steps.how.outputs.mode == 'placeholder'
        name: Write a placeholder dashboard
        shell: bash
        run: |
          mkdir -p packages/pxsig/dist/dashboard
          echo '<!doctype html><title>pxsig</title><p>Placeholder dashboard from a release dry run.</p>' > packages/pxsig/dist/dashboard/index.html

      # Mode release: unpack the pxsig-dashboard.tar.gz attached to this tag's GitHub release
      # (top-level folder dashboard/). Its sha256 goes into the release's SHA256SUMS (pack job).
      - if: steps.how.outputs.mode == 'release'
        name: Fetch the dashboard from the release
        shell: bash
        run: |
          set -euo pipefail
          dl="${RUNNER_TEMP}/dashboard-download"
          mkdir -p "$dl"
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --pattern pxsig-dashboard.tar.gz --dir "$dl"
          # Only dashboard/... entries, no absolute paths, no parent references.
          tar tzf "$dl/pxsig-dashboard.tar.gz" > "$dl/entries.txt"
          outside=$(grep -Ev '^(\./)?dashboard(/|$)' "$dl/entries.txt" || true)
          if [ -n "$outside" ] || grep -Eq '(^/|(^|/)\.\.(/|$))' "$dl/entries.txt"; then
            echo "::error::pxsig-dashboard.tar.gz must contain only a top-level dashboard/ folder"
            exit 1
          fi
          mkdir -p packages/pxsig/dist
          rm -rf packages/pxsig/dist/dashboard
          tar xzf "$dl/pxsig-dashboard.tar.gz" -C packages/pxsig/dist --no-same-owner
          # `pnpm --filter @pxsig/dashboard build` writes dashboard/BUILD.json (docs/releasing.md):
          # without it nothing records how the bundle was built, and the SBOM misses what it inlines.
          node scripts/check-dashboard-build.mjs packages/pxsig/dist/dashboard --adapter hydrotik
          echo "release asset pxsig-dashboard.tar.gz: sha256 $(sha256sum "$dl/pxsig-dashboard.tar.gz" | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Check the dashboard
        shell: bash
        run: |
          test -f packages/pxsig/dist/dashboard/index.html || { echo "::error::packages/pxsig/dist/dashboard/index.html is missing"; exit 1; }
          find packages/pxsig/dist/dashboard -type f | sort
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard
          path: packages/pxsig/dist/dashboard
          if-no-files-found: error
          retention-days: 7

  # A CycloneDX SBOM of the Rust engine (the crates compiled into every binary), from Cargo.lock.
  sbom-rust:
    name: SBOM (Rust)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-26
        with:
          toolchain: 1.99.0 # rust-toolchain.toml
      - name: cargo-cyclonedx
        run: cargo install --locked cargo-cyclonedx@0.5.9
      - name: Write the SBOM
        shell: bash
        run: |
          set -euo pipefail
          cargo cyclonedx --format json --spec-version 1.5 --override-filename pxsig-engine.cdx
          mkdir -p sbom
          mv crates/pxsig-cli/pxsig-engine.cdx.json sbom/pxsig-engine.cdx.json
          find crates -name 'pxsig-engine.cdx.json' -delete
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-rust
          path: sbom/pxsig-engine.cdx.json
          if-no-files-found: error
          retention-days: 7

  # Everything a release ships, packed once: the npm tarballs that are published, the raw binaries,
  # the dashboard, the SBOMs and SHA256SUMS over all of them. The publish job publishes these exact
  # tarballs, so the checksums and attestations describe what npm serves.
  pack:
    name: Pack
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: [verify, build, dashboard, sbom-rust]
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: npm
        run: npm install -g npm@11.21.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pxsig-*
          path: release-artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dashboard
          path: packages/pxsig/dist/dashboard
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom-rust
          path: release-files
      # packages/cli-dist/ is git-ignored (packages/cli-*/): generated here, never committed. The
      # package.json edit (version, optionalDependencies) stays in this job's checkout.
      - name: Generate the platform packages
        run: >
          node scripts/make-platform-packages.mjs
          --version "$VERSION"
          --artifacts release-artifacts
          --out packages/cli-dist
          --write-optional-deps packages/pxsig/package.json
      - name: Pack every package
        shell: bash
        run: |
          set -euo pipefail
          out="$PWD/release-files"
          mkdir -p "$out"
          # pxsig's prepack step (the dashboard sources, docs/ui and LICENSE) runs here, then the
          # published manifests drop `scripts` and `devDependencies` and get the root LICENSE
          # (scripts/pack-manifest.mjs), so every package is packed with --ignore-scripts. The
          # platform packages got theirs from make-platform-packages; --check requires it in each.
          node scripts/sync-dashboard-source.mjs
          node scripts/pack-manifest.mjs packages/pxsig packages/storybook-addon
          for dir in packages/cli-dist/cli-*/ packages/pxsig packages/storybook-addon; do
            (cd "$dir" && npm pack --ignore-scripts --pack-destination "$out")
          done
          test -f "$out/pxsig-${VERSION}.tgz"
          node scripts/pack-manifest.mjs --check "$out"/*.tgz
          # Each packed tarball as npm will serve it: exports, files and types resolve.
          for f in "$out/pxsig-${VERSION}.tgz" "$out"/pxsig-storybook-addon-*.tgz; do npx --yes publint@0.3.25 run "$f" --level warning --strict; done
          (cd packages/pxsig/dist && COPYFILE_DISABLE=1 tar czf "$out/pxsig-dashboard.tar.gz" dashboard)
      # The npm SBOM describes what installing the published pxsig package brings in: the tarball
      # is installed into an empty project and cyclonedx-npm reads that tree.
      - name: SBOM (npm)
        shell: bash
        run: |
          set -euo pipefail
          tmp="${RUNNER_TEMP}/sbom-npm"
          mkdir -p "$tmp" && cd "$tmp"
          npm init -y >/dev/null && npm pkg set name="pxsig-${VERSION}-install"
          npm install --ignore-scripts --omit=optional --no-audit --no-fund "$GITHUB_WORKSPACE/release-files/pxsig-${VERSION}.tgz"
          npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --omit dev --output-format JSON --output-file "$GITHUB_WORKSPACE/release-files/pxsig-npm.cdx.json"
      # The dashboard bundle inlines packages npm never installs: add them to the npm SBOM.
      - name: SBOM (dashboard bundle)
        run: node scripts/bundle-sbom.mjs --dashboard packages/pxsig/dist/dashboard --sbom release-files/pxsig-npm.cdx.json
      # Known advisories, any severity, in everything the release ships, read from its SBOMs: the npm
      # install tree, the packages the dashboard bundle inlines (npm never installs them, so no audit
      # sees them) and the engine's crates. osv-scanner is pinned and its download checked against
      # the sha256 its release publishes (osv-scanner_SHA256SUMS).
      - name: Advisories (osv-scanner)
        shell: bash
        env:
          OSV_VERSION: 2.7.0
          OSV_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b # linux_amd64
        run: |
          set -euo pipefail
          bin="${RUNNER_TEMP}/osv-scanner"
          curl -fsSL -o "$bin" "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  $bin" | sha256sum -c -
          chmod +x "$bin"
          "$bin" scan source -L release-files/pxsig-npm.cdx.json -L release-files/pxsig-engine.cdx.json
      - name: Raw binaries and SHA256SUMS
        run: node scripts/release-files.mjs --artifacts release-artifacts --out release-files
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: release-files
          if-no-files-found: error
          retention-days: 7
      # Which dashboard screens look different from the last release's: both rendered on this
      # runner by this checkout's `pxsig dashboard check` and compared by the engine. After the
      # release files are packed and uploaded, so nothing here touches them. A list in the job
      # summary and a gallery artifact, never a failure (scripts/dashboard-drift.mjs).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Dashboard drift since the last release
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -d packages/pxsig/dist/dashboard/assets ]; then
            echo "Dashboard drift: the dashboard is a placeholder, nothing to compare." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          prev="" dl="${RUNNER_TEMP}/previous-dashboard"
          mkdir -p "$dl"
          for tag in $(gh release list --repo "${GITHUB_REPOSITORY}" --exclude-drafts --limit 20 --json tagName --jq '.[].tagName'); do
            [ "$tag" = "${GITHUB_REF_NAME}" ] && continue
            if gh release download "$tag" --repo "${GITHUB_REPOSITORY}" --pattern pxsig-dashboard.tar.gz --dir "$dl" 2>/dev/null; then prev="$tag"; break; fi
          done
          if [ -z "$prev" ]; then
            echo "Dashboard drift: no earlier release has pxsig-dashboard.tar.gz, nothing to compare." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Only dashboard/... entries, no absolute paths, no parent references (as in the dashboard job).
          tar tzf "$dl/pxsig-dashboard.tar.gz" > "$dl/entries.txt"
          if grep -Ev '^(\./)?dashboard(/|$)' "$dl/entries.txt" | grep -q . || grep -Eq '(^/|(^|/)\.\.(/|$))' "$dl/entries.txt"; then
            echo "::warning::${prev}'s pxsig-dashboard.tar.gz holds more than a dashboard/ folder: not compared"
            exit 0
          fi
          tar xzf "$dl/pxsig-dashboard.tar.gz" -C "$dl" --no-same-owner
          pnpm install --frozen-lockfile
          pnpm --filter pxsig exec playwright install --with-deps chromium
          bin="${GITHUB_WORKSPACE}/release-artifacts/pxsig-linux-x64/pxsig"
          chmod +x "$bin"
          echo "Dashboard drift: compared with ${prev}'s dashboard." >> "$GITHUB_STEP_SUMMARY"
          PXSIG_BIN="$bin" node scripts/dashboard-drift.mjs --base-build "$dl/dashboard" --head-build packages/pxsig/dist/dashboard --out "${RUNNER_TEMP}/dashboard-drift"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-drift
          path: ${{ runner.temp }}/dashboard-drift/head
          if-no-files-found: ignore
          retention-days: 7

  # Provenance attestations for every release file (GitHub's signed record of the workflow run and
  # commit that produced each one), then the files attached to the GitHub release. Skipped in a dry
  # run, which attests and attaches nothing.
  attest:
    name: Attest and attach
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: [verify, pack]
    if: needs.verify.outputs.dry_run != 'true'
    permissions:
      contents: write # attach the files to the GitHub release
      id-token: write # sign the attestations
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      DIST_TAG: ${{ needs.verify.outputs.dist_tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release-files
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-files/*
      - name: Attach to the GitHub release
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            pre=""; if [ "$DIST_TAG" = next ]; then pre="--prerelease"; fi
            gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --verify-tag $pre \
              --title "${GITHUB_REF_NAME}" --notes "See CHANGELOG.md. Verifying the downloads: docs/releasing.md#verifying-a-release."
          fi
          # The dashboard asset may already be there (it is where the dashboard came from): the
          # repacked copy has the same contents, and SHA256SUMS lists the one attached here.
          gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --clobber release-files/*

  publish:
    name: Publish to npm
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: [verify, pack, attest]
    # After the attestations, so every published file can be verified from the moment it is on npm;
    # in a dry run attest is skipped and this still runs.
    if: ${{ !cancelled() && needs.pack.result == 'success' && (needs.attest.result == 'success' || needs.attest.result == 'skipped') }}
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    env:
      DIST_TAG: ${{ needs.verify.outputs.dist_tag }}
      DRY_RUN: ${{ needs.verify.outputs.dry_run == 'true' && '--dry-run' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Trusted publishing: npm exchanges this job's OIDC identity for a short-lived publish token,
      # so no long-lived token is stored. It needs npm 11.5.1 or later; the version is pinned. A
      # package that does not exist yet cannot have a trusted publisher: for that first publish only,
      # an `NPM_TOKEN` secret in the `npm` environment is used if present (delete it afterwards; see
      # docs/releasing.md).
      - name: npm (trusted publishing)
        shell: bash
        env:
          BOOTSTRAP_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm install -g npm@11.21.0
          npm --version
          if [ -n "$BOOTSTRAP_TOKEN" ]; then
            echo "::warning::NPM_TOKEN is set: publishing with it (bootstrap). Remove it once trusted publishers are configured."
            echo "//registry.npmjs.org/:_authToken=${BOOTSTRAP_TOKEN}" > "$HOME/.npmrc"
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release-files
      # The platform packages first, then pxsig (which depends on them), then the addon. Each
      # tarball is the one the pack job checksummed; a version already on npm is skipped, so a
      # failed run can be re-run.
      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          publish() {
            f="$1"
            meta=$(tar -xzOf "$f" package/package.json)
            name=$(node -e 'const p=JSON.parse(process.argv[1]);console.log(p.name)' "$meta")
            v=$(node -e 'const p=JSON.parse(process.argv[1]);console.log(p.version)' "$meta")
            if npm view "${name}@${v}" version >/dev/null 2>&1; then
              if [ -n "$DRY_RUN" ]; then
                # npm refuses even `publish --dry-run` over a published version; `pack --dry-run`
                # reads the tarball path the same way, so the dry run still tests it.
                echo "${name}@${v} is already published; checking the tarball path with npm pack"
                npm pack "./$f" --dry-run >/dev/null
              else
                echo "${name}@${v} is already published; skipping"
              fi
              return
            fi
            # `./`: npm reads a bare `dir/file.tgz` as a GitHub repository (`user/repo`).
            npm publish "./$f" --provenance --access public --tag "$DIST_TAG" $DRY_RUN
          }
          for f in release-files/pxsig-cli-*.tgz; do publish "$f"; done
          publish "release-files/pxsig-${{ needs.verify.outputs.version }}.tgz"
          for f in release-files/pxsig-storybook-addon-*.tgz; do publish "$f"; done
