# pxsig's own baselines (docs/releasing.md, "pxsig's own baselines"): the dashboard, built on the
# design system at the commit design-system.json pins, rendered in pxsig's container (docker/screens-image.json) and
# checked against packages/dashboard/.pxsig: its fixture screens, and its live screens (the real
# `pxsig serve` on a staged example, driven through the reviewer's flows; "Live screens"). A screen
# that changed, is new or did not render fails the run until its baseline is approved and committed. The renders are uploaded as the
# `pxsig-screens` artifact, which the review starts from. Each fixture screen renders twice in the
# run, and one whose two renders differ (unstable) fails it too (scripts/lib/screens-repeat.mjs).
name: screens

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screens-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  screens:
    name: Dashboard screens
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      # Whether the PXSIG_DS_SOURCE secret (a git URL of the design-system monorepo, credentials
      # included) is set. Pull requests from forks and from Dependabot get no secrets: the job says
      # so and checks nothing. The secret itself reaches only the step that fetches.
      HAS_DS: ${{ secrets.PXSIG_DS_SOURCE != '' }}
    steps:
      - id: has
        name: Design system source
        shell: bash
        run: |
          if [ "${HAS_DS}" != true ]; then
            echo "::notice::no PXSIG_DS_SOURCE secret in this run (a fork or Dependabot): the screens are not checked"
            echo "ds=false" >> "$GITHUB_OUTPUT"
          else
            echo "ds=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.has.outputs.ds == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.has.outputs.ds == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - if: steps.has.outputs.ds == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          # The live screens install examples/single-package on the runner (scripts/live/stage.mjs).
          cache-dependency-path: |
            pnpm-lock.yaml
            examples/single-package/pnpm-lock.yaml
      # The commit design-system.json pins (40 lower-case hex, checked), fetched as `pnpm ds:fetch`
      # does in a worktree: one code path, so CI and worktrees build the same design system. The
      # script never prints the source and leaves it in no file. PXSIG_DS_DIR keeps the checkout in
      # the runner's temp folder, outside ./target, which the Rust cache saves.
      - if: steps.has.outputs.ds == 'true'
        name: Fetch the design system
        shell: bash
        env:
          PXSIG_DS_SOURCE: ${{ secrets.PXSIG_DS_SOURCE }}
          PXSIG_DS_DIR: ${{ runner.temp }}/design-system
        run: node scripts/ds-fetch.mjs
      - if: steps.has.outputs.ds == 'true'
        name: Build the dashboard on the design system
        shell: bash
        env:
          PXSIG_DS_DIR: ${{ runner.temp }}/design-system
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          # No adapter named: this repository's build is hydrotik, on the PXSIG_DS_DIR checkout.
          pnpm --filter @pxsig/dashboard build
          node scripts/check-dashboard-build.mjs packages/pxsig/dist/dashboard --adapter hydrotik --commit "$(node scripts/ds-fetch.mjs --pin)"
      # `pnpm typecheck` with the design system: the reference adapter against its sources, and the
      # committed adapters/hydrotik/design-system.d.ts against a fresh `ui.mjs types`, which reads
      # the design system's built declarations (CONTRIBUTING.md).
      - if: steps.has.outputs.ds == 'true'
        name: Type-check the reference adapter against the design system
        shell: bash
        env:
          TURBO_TELEMETRY_DISABLED: '1'
          PXSIG_DS_DIR: ${{ runner.temp }}/design-system
        run: |
          set -euo pipefail
          ds="${PXSIG_DS_DIR}"
          (cd "$ds" && pnpm turbo run build --filter=@hydrotik/design-system)
          PXSIG_DS_SOURCE="$ds" node scripts/typecheck.mjs
      # The live screens run on this commit's engine (docs/releasing.md, "Live screens"): built here,
      # on the runner (Ubuntu, as the image), and seen by the container at the same path.
      - if: steps.has.outputs.ds == 'true'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-26
        with:
          toolchain: 1.99.0 # rust-toolchain.toml
      - if: steps.has.outputs.ds == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - if: steps.has.outputs.ds == 'true'
        name: Build the engine for the live screens
        run: cargo build --release --locked
      - if: steps.has.outputs.ds == 'true'
        id: check
        name: Check the screens in pxsig's container
        shell: bash
        run: |
          set -uo pipefail
          docker pull -q "$(node -p "require('./docker/screens-image.json').image")"
          # The runner's bash has -e on: catch the check's exit, so 1 (screens to review) still
          # writes the summary and the output that "Screens to review" reads. Above 1 fails below.
          code=0
          PXSIG_LIVE_BIN="$PWD/target/release/pxsig" node scripts/screens-container.mjs || code=$?
          if [ -f packages/dashboard/.pxsig/reports/summary.md ]; then
            cat packages/dashboard/.pxsig/reports/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f packages/dashboard/.pxsig/reports/fixture-repeat/summary.md ]; then
            cat packages/dashboard/.pxsig/reports/fixture-repeat/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" -le 1 ]
      # The review: download this artifact into packages/dashboard/.pxsig, run `pxsig serve` in
      # packages/dashboard and approve through `pxsig serve --link` (docs/releasing.md).
      - if: steps.has.outputs.ds == 'true' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pxsig-screens
          path: |
            packages/dashboard/.pxsig/
            !packages/dashboard/.pxsig/baselines/
            !packages/dashboard/.pxsig/approvals.ndjson
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      - if: steps.check.outputs.code == '1'
        name: Screens to review
        shell: bash
        run: |
          echo "::error::screens changed, are new, did not render or rendered differently twice: review the pxsig-screens artifact and commit the approved baselines (docs/releasing.md, \"pxsig's own baselines\")"
          exit 1
