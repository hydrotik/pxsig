name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its older run. On main each commit has its own group, so a
# run is never cancelled, nor left pending, by the next merge.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  clean:
    name: Clean repository
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # commitlint reads the pull request's commits
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22 # latest 22.x; ui:check needs 22.18+ and says so below that
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Known advisories (high and critical) in what ships to consumers: production dependencies
      # only; dev tooling is updated through Dependabot instead (CONTRIBUTING.md, dependency scans).
      - run: pnpm audit --prod --audit-level high
      # oxlint (.oxlintrc.json): an error fails; a warning may not be added to any file
      # (scripts/lint-warnings-baseline.json). sherif: the workspace's package.json files agree.
      - run: pnpm lint
      - run: pnpm lint:ratchet
      # oxfmt (.oxfmtrc.json): every file as the formatter writes it.
      - run: pnpm format:check
      - run: pnpm lint:workspace
      # Commit subjects (commitlint.config.cjs), on the pull request's own commits.
      - if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
      # Files and paths only. The denylist of names never leaves the maintainer's machine: /scrub
      # checks it there after any work that read another repository (CONTRIBUTING.md).
      - run: node scripts/check-clean.mjs
      # Changelog fragments (changelog.d/README.md): well formed, and a pull request adds one instead
      # of editing CHANGELOG.md, which only a release/ branch changes.
      - run: node scripts/changelog.mjs check
      # Cargo.toml, Cargo.lock and every package.json carry the same version (docs/releasing.md).
      - run: node scripts/check-versions.mjs
      # Every relative link and #anchor in the tracked Markdown resolves.
      - run: node scripts/check-links.mjs
      # Source and test files: at most 5,000 tokens, and one already over may not grow
      # (scripts/file-size-baseline.json; the pre-commit hook checks the staged files).
      - run: node scripts/check-file-size.mjs --all
      # Every script's own tests (scripts/*.test.mjs), found by name so a new one cannot be left
      # out: the clean check's rules, the published package.json files, changelog fragments, the
      # release files and platform packages, the Windows runtime check, versions, links, the
      # required checks, file sizes, types, the pre-commit config and the research tools.
      - run: node --test scripts/*.test.mjs
      - if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF" && node scripts/changelog.mjs check --since FETCH_HEAD
      # The dashboard's UI contract: no design-system import outside the adapters; the manifest,
      # the feature catalogue, the build prompt and the reference adapter agree with the code.
      - run: node scripts/ui.mjs check

  rust:
    name: Rust (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-26
        with:
          toolchain: 1.99.0 # rust-toolchain.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace --locked
      # Lints and formatting are the same on every OS: once, on Linux.
      - if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Advisories, licences, duplicate crates and sources of the engine's crates (deny.toml).
      - if: runner.os == 'Linux'
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-deny@0.20.2
      - if: runner.os == 'Linux'
        run: cargo deny --locked check
      # Line coverage with a floor (Linux only), raised only in its own chore commit. No coverage
      # service. Tests in tests.rs or *_tests.rs files are not counted (inline test modules are),
      # so moving a test module into its own file lowers the figure with no change in coverage.
      - if: runner.os == 'Linux'
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-llvm-cov@0.9.1
      - if: runner.os == 'Linux'
        run: |
          rustup component add llvm-tools-preview
          cargo llvm-cov --workspace --locked --summary-only --fail-under-lines 72
      - run: cargo build --release --locked
      # The engine runs on a Windows machine without the Visual C++ Redistributable (crt-static).
      - if: runner.os == 'Windows'
        run: node scripts/check-win-runtime.mjs target/release/pxsig.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pxsig-${{ matrix.os }}
          path: target/release/pxsig${{ runner.os == 'Windows' && '.exe' || '' }}
          retention-days: 3

  node:
    name: Node (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    needs: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22 # latest 22.x; ui:check needs 22.18+ and says so below that
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pxsig-${{ matrix.os }}
          path: target/release
      - if: runner.os != 'Windows'
        run: chmod +x target/release/pxsig
      # Chromium before the pxsig suite: its browser tests (render environment, server flows,
      # capture helpers) skip without one, and a skip is not a pass.
      # System libraries are a Linux concern; macOS and Windows runners need only the browser.
      - run: pnpm --filter pxsig exec playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium
      # PXSIG_TEST_STRICT: a test that would skip for a missing engine, browser or git fails instead.
      # The only skips left are the per-OS ones listed in packages/pxsig/test/strict.mjs.
      - if: runner.os != 'Linux'
        run: pnpm --filter pxsig test
        env:
          PXSIG_TEST_STRICT: '1'
      # On Linux, the same suite with coverage floors (packages/pxsig/package.json, test:coverage),
      # and the table in the job summary. It counts code run in the test process only: a CLI or
      # server a test starts is a subprocess and is not counted, so the figure understates.
      - if: runner.os == 'Linux'
        shell: bash
        env:
          PXSIG_TEST_STRICT: '1'
        run: |
          status=0
          pnpm --filter pxsig run test:coverage | tee coverage.txt || status=$?
          {
            echo '### pxsig coverage (test process only: CLI and server subprocesses are not counted)'
            echo '```'
            sed -n '/start of coverage report/,/end of coverage report/p' coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - run: pnpm --filter @pxsig/storybook-addon test
      # The scale benchmark's generator and verdicts (the benchmark itself runs nightly: bench.yml).
      - run: node --test scripts/bench/run.test.mjs
      # The folder copy the release's pack job uses, on every OS (Windows paths among them).
      - run: node --test scripts/copy-tree.test.mjs
      # tsc --noEmit: the dashboard, its test harness and both adapters (the reference adapter against
      # its committed design-system declarations, which must cover every name it imports).
      - run: pnpm typecheck
      - run: node --test scripts/hydrotik-types.test.mjs
      # The diff-viewer primitives in a browser (keyboard, ARIA, controlled state), and the
      # dashboard's review and repair flows against a mocked server.
      - run: pnpm --filter @pxsig/dashboard test
        env:
          PXSIG_TEST_STRICT: '1'
      # The pxsig suite again on Node 24, the container image's Node (engines: >=22.18). Linux
      # only, and last: every step after this setup-node runs on 24.
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - if: matrix.os == 'ubuntu-latest'
        run: node --version && pnpm --filter pxsig test
        env:
          PXSIG_TEST_STRICT: '1'

  examples:
    name: Examples (end to end) (${{ matrix.os }})
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    needs: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22 # latest 22.x; ui:check needs 22.18+ and says so below that
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pxsig-${{ matrix.os }}
          path: target/release
      - if: runner.os != 'Windows'
        run: chmod +x target/release/pxsig
      # System libraries are a Linux concern; macOS and Windows runners need only the browser.
      - run: pnpm --filter pxsig exec playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium
      - run: node scripts/examples-test.mjs
      # Which dashboard screens this pull request changes: main's dashboard and this one's, built
      # with the example adapter and rendered on this runner, compared by the engine. A list in the
      # job summary and a gallery artifact, never a failure (scripts/dashboard-drift.mjs).
      - if: github.event_name == 'pull_request' && runner.os == 'Linux'
        name: Dashboard drift against main
        continue-on-error: true
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          node scripts/dashboard-drift.mjs --base-ref origin/main --out "${RUNNER_TEMP}/dashboard-drift"
      - if: github.event_name == 'pull_request' && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-drift
          path: ${{ runner.temp }}/dashboard-drift/head
          if-no-files-found: ignore
          retention-days: 7
      # pxsig as a user installs it: the release's scripts pack pxsig and this OS's platform package
      # (0.0.0-ci), npm installs both into a folder whose path has a space, and with no PXSIG_BIN
      # the engine resolves from the platform package; `doctor --ci` under PXSIG_DEBUG=spawn starts
      # only node, git and that engine. On Windows, the closest stand-in for a locked-down machine.
      - run: node scripts/install-smoke.mjs

  compat:
    name: Older pxsig on this store
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22 # latest 22.x; ui:check needs 22.18+ and says so below that
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pxsig-ubuntu-latest
          path: target/release
      - run: chmod +x target/release/pxsig
      # What a teammate still on 0.3.2 sees in a store this version wrote
      # (docs/configuration.md#pxsigworkspacejson, `requires`).
      - run: node scripts/compat-old.mjs 0.3.2
        env:
          PXSIG_BIN: target/release/pxsig
