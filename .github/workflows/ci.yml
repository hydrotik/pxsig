name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  clean:
    name: Clean repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Files and paths only. The denylist of names never leaves the maintainer's machine: the
      # pre-push hook (.githooks/pre-push) checks it before anything is pushed.
      - run: node scripts/check-clean.mjs
      # The dashboard's UI contract: no design-system import outside the adapters; the manifest,
      # the feature catalogue, the build prompt and the reference adapter agree with the code.
      - run: node scripts/ui.mjs check

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo build --release
      - uses: actions/upload-artifact@v7
        with:
          name: pxsig-linux-x64
          path: target/release/pxsig
          retention-days: 3

  node:
    name: Node
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: pxsig-linux-x64
          path: target/release
      - run: chmod +x target/release/pxsig
      - run: pnpm --filter pxsig test
      # The diff-viewer primitives in a browser (keyboard, ARIA, controlled state).
      - run: pnpm --filter pxsig exec playwright install --with-deps chromium
      - run: pnpm --filter @pxsig/dashboard test

  examples:
    name: Examples (end to end)
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: pxsig-linux-x64
          path: target/release
      - run: chmod +x target/release/pxsig
      - run: pnpm --filter pxsig exec playwright install --with-deps chromium
      - run: node scripts/examples-test.mjs
