name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  clean:
    name: Clean repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22 # latest 22.x; ui:check needs 22.18+ and says so below that
      # Files and paths only. The denylist of names never leaves the maintainer's machine: /scrub
      # checks it there after any work that read another repository (CONTRIBUTING.md).
      - run: node scripts/check-clean.mjs
      # Its own rules, the product-shot exemption among them.
      - run: node --test scripts/check-clean.test.mjs
      # Changelog fragments (changelog.d/README.md): well formed, and a pull request adds one instead
      # of editing CHANGELOG.md, which only a release/ branch changes.
      - run: node scripts/changelog.mjs check
      - run: node --test scripts/changelog.test.mjs
      - if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF" && node scripts/changelog.mjs check --since FETCH_HEAD
      # The dashboard's UI contract: no design-system import outside the adapters; the manifest,
      # the feature catalogue, the build prompt and the reference adapter agree with the code.
      - run: node scripts/ui.mjs check

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo build --release
      - uses: actions/upload-artifact@v7
        with:
          name: pxsig-${{ matrix.os }}
          path: target/release/pxsig${{ runner.os == 'Windows' && '.exe' || '' }}
          retention-days: 3

  node:
    name: Node (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    needs: rust
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22 # latest 22.x; ui:check needs 22.18+ and says so below that
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: pxsig-${{ matrix.os }}
          path: target/release
      - if: runner.os != 'Windows'
        run: chmod +x target/release/pxsig
      - run: pnpm --filter pxsig test
      - run: pnpm --filter @pxsig/storybook-addon test
      # tsc --noEmit: the dashboard, its test harness and the plain example adapter.
      - run: pnpm typecheck
      # The diff-viewer primitives in a browser (keyboard, ARIA, controlled state), and the
      # dashboard's review and repair flows against a mocked server.
      # System libraries are a Linux concern; macOS and Windows runners need only the browser.
      - run: pnpm --filter pxsig exec playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium
      - run: pnpm --filter @pxsig/dashboard test

  examples:
    name: Examples (end to end) (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    needs: rust
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22 # latest 22.x; ui:check needs 22.18+ and says so below that
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: pxsig-${{ matrix.os }}
          path: target/release
      - if: runner.os != 'Windows'
        run: chmod +x target/release/pxsig
      # System libraries are a Linux concern; macOS and Windows runners need only the browser.
      - run: pnpm --filter pxsig exec playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium
      - run: node scripts/examples-test.mjs
