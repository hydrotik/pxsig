# Dependency updates: GitHub Actions, the pnpm workspace and the Rust workspace, weekly on Monday.
# Each pull request goes through the same required checks as any other (ci.yml). Commit subjects
# are `chore(deps): …` (commitlint.config.cjs). Security updates and alerts are switched on in the
# repository settings (Code security), not here.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: npm # pnpm: Dependabot reads pnpm-lock.yaml
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    # Groups take minor and patch updates only: a major version (a new TypeScript, Vite, …) comes
    # as its own pull request, to be read and taken on its own.
    groups:
      dev:
        dependency-type: development
        update-types: [minor, patch]
      prod:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # The types follow the Node.js pxsig supports (engines, .nvmrc: 22), not the newest Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Vite is pinned by the root package.json's pnpm.overrides, so a major bump of the dashboard's
      # specifier alone changes nothing. A new Vite major (with its @vitejs/plugin-react) is taken
      # by hand: the overrides, build-config.mjs and the Vite range users build with.
      - dependency-name: vite
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitejs/plugin-react'
        update-types: ['version-update:semver-major']

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
